<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Serviços | BarberSaaS</title>
<!-- pwa-head -->
<link rel="stylesheet" href="/menu.css">

<link rel="stylesheet" href="/ui.css">

<body>
<div class="layout">
  <aside class="sidebar"><div class="logo"><h2>Barber<span>SaaS</span></h2></div><nav class="menu"></nav></aside>

    <header><div><h1>Serviços</h1><p>Preço e duração definem como os horários são liberados na agenda.</p></div><button id="add" type="button">+ Novo serviço</button></header>

    <section id="services"></section>
    <div class="panel-visionario-credit"><a href="https://visionariodev.com.br" target="_blank" rel="noopener">Desenvolvido por Visionário Dev</a></div>
