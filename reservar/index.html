<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agendar horário | BarberSaaS</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#fff;font:16px Arial}main{width:min(94%,480px);padding:28px;border:1px solid #273c54;background:#131e31;border-radius:18px}h1{margin:0 0 8px;color:#08a9df}label{display:block;margin:16px 0 4px}input,select,button{width:100%;padding:13px;border-radius:9px;font:inherit}input,select{background:#0b1220;color:white;border:1px solid #42536c}button{margin-top:20px;background:#08a9df;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.5}#status{min-height:24px}</style><link rel="icon" href="/img/favicon.png"></head><body><main><h1 id="shopName">Carregando...</h1><p>Escolha o serviço e informe seu nome e WhatsApp. Não é necessário criar conta.</p><form id="booking"><label>Serviço<select id="service" required></select></label><label>Data<input id="date" type="date" required></label><label>Horário<input id="time" type="time" step="1800" required></label><label>Nome<input id="name" required minlength="2"></label><label>WhatsApp<input id="phone" type="tel" required minlength="10"></label><button id="submit" type="submit">Confirmar agendamento</button></form><p id="status" role="status"></p></main><script type="module" src="reservar.js"></script></body></html>
