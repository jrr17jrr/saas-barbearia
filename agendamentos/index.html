<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agenda | BarberSaaS</title>
<!-- pwa-head -->
<link rel="stylesheet" href="/menu.css">
<link rel="stylesheet" href="agendamentos.css">
<link rel="stylesheet" href="/ui.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
.agenda-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.agenda-tools select,.agenda-tools input{background:#0f172a;border:1px solid #334155;color:#fff;padding:10px;border-radius:10px;min-height:44px;font:14px Poppins,sans-serif}
.day-nav{display:flex;align-items:center;gap:6px}
.day-nav button{min-width:44px;min-height:44px;border:1px solid #334155;border-radius:10px;background:#111b2d;color:#fff;font-size:18px;cursor:pointer}
.day-nav .today-btn{font-size:13px;padding:0 12px}
.slot.cancelled,.slot.no_show{opacity:.6}
.slot.cancelled b{text-decoration:line-through}
.slot-main small.pro{color:#7dd3fc}
.week-item.cancelled{opacity:.5;text-decoration:line-through}
.week-item.completed span{color:#86efac}
.week-day-head button{margin-left:auto;background:#12394b;border:0;color:#67e8f9;border-radius:8px;padding:4px 8px;font-size:11px;cursor:pointer}
.show-cancelled{display:flex;align-items:center;gap:6px;color:#94a3b8;font-size:13px}
.client-suggest{display:grid;gap:4px;margin-top:4px}
.client-suggest button{text-align:left;background:#17263a;border:1px solid #334155;color:#fff;border-radius:9px;padding:9px;cursor:pointer}
.msg-options{display:grid;gap:8px}
.msg-options button{text-align:left;border:1px solid #334155;background:#1e293b;color:#fff;padding:12px;border-radius:10px;cursor:pointer}
.msg-options small{display:block;color:#94a3b8}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar"><div class="logo"><h2>Barber<span>SaaS</span></h2></div><nav class="menu"></nav></aside>
  <button class="menu-mobile" id="menuBtn" type="button">☰</button>
  <div class="overlay" id="overlay"></div>
  <main class="content">
    <header class="topbar">
      <div><h1>Minha Agenda</h1><p>Agendamentos, bloqueios e horários livres em tempo real.</p></div>
      <div class="top-actions">
        <button class="ghost-btn" id="blockBtn" type="button">+ Bloquear horário</button>
        <button class="new-btn" id="newBtn" type="button">+ Novo agendamento</button>
      </div>
    </header>
    <section class="summary" aria-live="polite">
      <div><small>Agendados</small><strong id="sTotal">—</strong></div>
      <div><small>Concluídos</small><strong id="sDone">—</strong></div>
      <div><small>Cancelados · Faltas</small><strong id="sLost">—</strong></div>
      <div><small>Bloqueios</small><strong id="sBlocks">—</strong></div>
    </section>
    <section class="agenda-box">
      <div class="agenda-head">
        <div><h2 id="dayTitle">—</h2><p id="dayHours">&nbsp;</p></div>
        <div class="view-tabs" role="tablist"><button id="todayView" class="active" type="button" role="tab" aria-selected="true">Dia</button><button id="weekView" type="button" role="tab" aria-selected="false">Semana</button></div>
      </div>
      <div class="agenda-tools">
        <div class="day-nav"><button type="button" id="prev" aria-label="Anterior">‹</button><button type="button" class="today-btn" id="goToday">Hoje</button><button type="button" id="next" aria-label="Próximo">›</button></div>
        <label class="sr-only" for="datePick">Data</label><input type="date" id="datePick">
        <label class="sr-only" for="proFilter">Profissional</label><select id="proFilter"><option value="">Todos os profissionais</option></select>
        <label class="show-cancelled"><input type="checkbox" id="showCancelled"> Mostrar cancelados</label>
      </div>
      <div class="timeline" id="timeline"></div>
      <div class="week-grid" id="weekGrid"></div>
    </section>
    <div class="panel-visionario-credit"><a href="https://visionariodev.com.br" target="_blank" rel="noopener">Desenvolvido por Visionário Dev</a></div>
  </main>
</div>
<script src="/menu.js"></script>
<script type="module" src="agenda.js"></script>
</body>
</html>
