<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Definir senha | BarberSaaS</title>
<!-- pwa-head -->
<link rel="stylesheet" href="/ui.css">
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#fff;font-family:Poppins,Arial,sans-serif;padding:16px}.card{width:min(100%,420px);background:#101c2e;border:1px solid #20334d;padding:32px;border-radius:22px}h1{margin:0 0 6px}h1 span{color:#08a9df}p{color:#91a2b8}label{display:block;margin:16px 0 6px;font-size:14px}input{width:100%;padding:14px;border-radius:10px;border:1px solid #30445f;background:#091525;color:#fff;font-size:16px;min-height:48px}button{width:100%;min-height:48px;padding:14px;margin-top:18px;border:0;border-radius:10px;background:#08a9df;color:#04101a;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.msg{min-height:24px;margin-top:12px;color:#f7c66a}.msg.ok{color:#86efac}a{color:#9bdfff}</style>
</head>
<body>
<main class="card">
  <h1>Barber<span>SaaS</span></h1>
  <p id="info">Validando link...</p>
  <form id="form" hidden novalidate>
    <label for="p1">Nova senha</label>
    <input id="p1" type="password" autocomplete="new-password" minlength="8" required>
    <label for="p2">Confirmar nova senha</label>
    <input id="p2" type="password" autocomplete="new-password" minlength="8" required>
    <button id="submit" type="submit">Salvar senha</button>
  </form>
  <div class="msg" id="msg" role="alert" aria-live="polite"></div>
</main>
<script type="module" src="redefinir.js"></script>
</body>
</html>
