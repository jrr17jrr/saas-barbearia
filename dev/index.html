<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel DEV | BarberSaaS</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:Poppins,Arial;padding:28px}.wrap{max-width:1100px;margin:auto}header{display:flex;justify-content:space-between;gap:15px;align-items:center}h1 span{color:#08a9df}button,input,select{padding:11px;border-radius:9px;border:1px solid #29405d;background:#0d1a2b;color:#fff}button{cursor:pointer}.primary{background:#08a9df;color:#04101a;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:25px 0}.stat,.shop,.formbox{background:#101c2e;border:1px solid #20334d;border-radius:16px;padding:18px}.stat b{font-size:26px;display:block}.shops{display:grid;gap:10px}.shop{display:flex;justify-content:space-between;align-items:center;gap:12px}.shop small{display:block;color:#8fa3bc}.actions{display:flex;gap:8px;flex-wrap:wrap}.formbox{display:none;margin-bottom:18px}.formbox.open{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.formbox h2{grid-column:1/-1}.formbox .full{grid-column:1/-1}@media(max-width:700px){body{padding:16px}.stats{grid-template-columns:1fr 1fr}.shop{align-items:flex-start;flex-direction:column}.formbox.open{grid-template-columns:1fr}.formbox h2,.formbox .full{grid-column:auto}}</style></head><body><main class="wrap"><header><div><h1>Barber<span>SaaS</span> DEV</h1><p>Visionário Dev • Administração da plataforma</p></div><div><button id="logout">Sair</button> <button class="primary" id="newShop">+ Nova barbearia</button></div></header><section class="stats" id="stats"></section><section class="formbox" id="formbox"><h2>Nova barbearia</h2><input id="name" placeholder="Nome da barbearia"><input id="slug" placeholder="slug-da-barbearia"><input id="owner" placeholder="Responsável"><input id="phone" placeholder="WhatsApp"><select id="plan"><option value="complete">Completo</op
