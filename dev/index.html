<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Painel DEV | BarberSaaS</title><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#08a9df"><link rel="icon" href="/img/icon-192.png"><link rel="stylesheet" href="/shared/ui.css"><style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:Poppins,Arial,sans-serif;padding:28px}.wrap{max-width:1180px;margin:auto}
header{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}h1{margin:0}h1 span{color:#08a9df}header p{margin:4px 0 0;color:#8fa3bc}
button,input,select,textarea{padding:11px;border-radius:9px;border:1px solid #29405d;background:#0d1a2b;color:#fff;font:inherit;font-size:14px}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}
.primary{background:#08a9df;color:#04101a;font-weight:700;border-color:#08a9df}.danger{background:#7f1d1d;border-color:#7f1d1d}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:25px 0}.stat,.shop,.panel{background:#101c2e;border:1px solid #20334d;border-radius:16px;padding:16px}.stat small{color:#8fa3bc}.stat b{font-size:26px;display:block}
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.toolbar input{flex:1;min-width:200px}
.shops{display:grid;gap:10px}.shop{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.shop small{display:block;color:#8fa3bc;margin-top:3px}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.actions button,.actions a{padding:8px 11px;font-size:13px}.actions a{color:#9bdfff;border:1px solid #29405d;border-radius:9px;text-decoration:none}
.pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;margin-left:6px;vertical-align:middle}.s-active{background:#14532d;color:#bbf7d0}.s-demo{background:#1e3a8a;color:#bfdbfe}.s-suspended{background:#78350f;color:#fde68a}.s-cancelled{background:#3f1d1d;color:#fecaca}.p-plan{background:#334155;color:#e2e8f0}
.layer{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:3000;padding:16px}.layer.open{display:flex}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 .full{grid-column:1/-1}label{display:grid;gap:4px;font-size:13px;color:#8fa3bc}.colors{display:flex;gap:10px}.colors input{padding:2px;height:42px;width:100%}
.member{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px;border:1px solid #20334d;border-radius:10px;margin:6px 0}.member small{display:block;color:#8fa3bc}
.muted{color:#8fa3bc;font-size:13px}
@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){body{padding:16px}.stats{grid-template-columns:1fr 1fr}.shop{grid-template-columns:1fr}.actions{justify-content:flex-start}.grid2{grid-template-columns:1fr}.grid2 .full{grid-column:auto}}
</style></head><body><main class="wrap">
<header><div><h1>Barber<span>SaaS</span> DEV</h1><p>Visionário Dev • Administração da plataforma</p></div><div style="display:flex;gap:8px"><button id="logout">Sair</button><button class="primary" id="newShop">+ Nova barbearia</button></div></header>
<section class="stats" id="stats" aria-live="polite"></section>
<div class="toolbar"><input id="search" type="search" placeholder="Buscar por nome, slug ou responsável" aria-label="Buscar barbearia"><select id="filterStatus" aria-label="Filtrar status"><option value="">Todos os status</option><option value="active">Ativas</option><option value="demo">Demonstração</option><option value="suspended">Suspensas</option><option value="cancelled">Canceladas</option></select><select id="filterPlan" aria-label="Filtrar plano"><option value="">Todos os planos</option><option value="site">Site</option><option value="chatbot">Chatbot</option><option value="complete">Completo</option></select></div>
<section class="shops" id="shops"><p class="muted">Carregando...</p></section>
</main>
<div class="layer" id="layer"><div class="bs-dialog" id="dialog"></div></div>
<script type="module" src="dev.js"></script></body></html>
