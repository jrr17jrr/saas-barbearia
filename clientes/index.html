<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clientes | BarberSaaS</title>
<!-- pwa-head -->
<link rel="stylesheet" href="/menu.css">
<link rel="stylesheet" href="clientes.css">
<link rel="stylesheet" href="/ui.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>.head-actions{display:flex;gap:8px;flex-wrap:wrap}.head-actions button{background:#04a4dc;color:#fff;border:0;border-radius:11px;padding:12px 15px;font-weight:600;cursor:pointer;min-height:44px}.client-row b small{display:block;font-weight:400}.client-row .actions{display:flex;gap:6px}.client-row .actions button{min-height:40px}.history-item{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar"><div class="logo"><h2>Barber<span>SaaS</span></h2></div><nav class="menu"></nav></aside>
  <button class="menu-mobile" id="menuBtn" type="button">☰</button>
  <div class="overlay" id="overlay"></div>
  <main class="content">
    <header>
      <div><h1>Clientes</h1><p>Conheça seus clientes e acompanhe o histórico de cada um.</p></div>
      <div class="head-actions"><label class="sr-only" for="search">Buscar cliente</label><input id="search" type="search" placeholder="Buscar por nome ou WhatsApp..."><button id="addClient" type="button">+ Cliente</button></div>
    </header>
    <section class="highlights" aria-live="polite">
      <div><small>Clientes cadastrados</small><b id="hTotal">—</b></div>
      <div><small>Mais fiel</small><b id="hLoyal">—</b><span id="hLoyalSub"></span></div>
      <div><small>Retornaram este mês</small><b id="hReturn">—</b></div>
    </section>
    <section class="client-box"><h2>Clientes</h2><div id="clientList"></div></section>
    <div class="panel-visionario-credit"><a href="https://visionariodev.com.br" target="_blank" rel="noopener">Desenvolvido por Visionário Dev</a></div>
  </main>
</div>
<script src="/menu.js"></script>
<script type="module" src="clientes.js"></script>
</body>
</html>
