<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Configurações | Barber SaaS</title>

    <link rel="stylesheet" href="/menu.css">

    <link rel="stylesheet" href="config.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="logo">
            <h2>Barber<span>SaaS</span></h2>
        </div>

           <nav class="menu">
          <a href="/dashboard/index.html" >
            <span>🏠</span>
            Dashboard
          </a>

          <a href="/agendamentos/index.html" >
            <span>📅</span>
            Agendamentos
          </a>

          <!-- <a href="#">
            <span>👥</span>
            Clientes
          </a> -->

          <a href="/lucros/index.html">
            <span>💰</span>
            Lucros
          </a>

          <a href="/link-agendamento/index.html" target="_blank">
            <span>🔗</span>
            Meu Link
          </a>

          <a href="/editar-link/index.html">
            <span>✏️</span>
            Editar Meu Link
          </a>

          <a href="/configuracões/index.html" class="active">
            <span>⚙️</span>
            Configurações
          </a>
        </nav>

    </aside>

    <button class="menu-mobile" id="menuBtn">☰</button>

    <div class="overlay" id="overlay"></div>

    <main class="content">

        <section class="topbar">

            <div>

                <h1>Configurações</h1>

                <p>Gerencie sua conta e sua barbearia.</p>

            </div>

        </section>

        <div class="settings-grid">

            <div class="box">

                <h2>Dados da Barbearia</h2>

                <input type="text" placeholder="Nome da Barbearia">

                <input type="text" placeholder="Telefone">

                <input type="email" placeholder="E-mail">

                <input type="text" placeholder="Endereço">

            </div>

            <div class="box">

                <h2>Logo</h2>

                <div class="logo-upload">

                    <img src="img/logo.png" alt="Logo">

                    <button>Alterar Logo</button>

                </div>

            </div>

            <div class="box">

                <h2>Horário de Funcionamento</h2>

                <input type="text" placeholder="Segunda à Sexta">

                <input type="text" placeholder="Sábado">

                <input type="text" placeholder="Domingo">

            </div>

            <div class="box">

                <h2>Alterar Senha</h2>

                <input type="password" placeholder="Senha Atual">

                <input type="password" placeholder="Nova Senha">

                <input type="password" placeholder="Confirmar Senha">

            </div>

            <div class="box">

                <h2>Plano</h2>

                <p><strong>Plano Atual:</strong> Premium</p>

                <button class="btn-primary">
                    Gerenciar Assinatura
                </button>

            </div>

            <div class="box">

                <h2>Salvar Alterações</h2>

                <button class="btn-primary">
                    Salvar Configurações
                </button>

            </div>

        </div>

    </main>

</div>

<script src="menu.js"></script>

</body>

</html>
