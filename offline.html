<title>Sem conexão | BarberSaaS</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#fff;font-family:Poppins,Arial,sans-serif;padding:20px;text-align:center}.card{max-width:380px}h1 span{color:#08a9df}p{color:#91a2b8}button{min-height:48px;padding:12px 20px;border:0;border-radius:10px;background:#08a9df;color:#04101a;font-weight:700;cursor:pointer;font-size:15px}</style>

<body>
<main class="card">
  <h1>Barber<span>SaaS</span></h1>
  <h2>Você está sem conexão</h2>
  <p>A agenda e os dados precisam de internet para ficarem sempre atualizados. Sua sessão continua salva — assim que a conexão voltar, é só tentar de novo.</p>
  <button type="button" onclick="location.reload()">Tentar novamente</button>
</main>
<script>addEventListener("online", () => location.reload());</script>
