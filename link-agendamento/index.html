<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="Agende seu horário online.">
<title>Agendar horário</title>
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="link-agendamento.css">
<link rel="stylesheet" href="/ui.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
.public-state{min-height:60vh;display:grid;place-items:center;text-align:center;color:var(--site-muted,#8190a5);padding:20px}
.service-card img{background:var(--site-surface,#0d1728)}
.booking-progress span{flex:1}
.booking-pro-photo{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:0 0 38px}
.booking-error{color:#fca5a5;font-size:12px;margin-top:8px;min-height:16px}
.booking-time,.booking-day,.booking-service-option,.booking-next,.booking-back{min-height:44px}
a.chatbot-launch{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.demo-badge{display:inline-block;margin-top:6px;font-size:10px;background:#3b2a07;color:#fde68a;border-radius:20px;padding:3px 9px}
</style>
</head>
<body>
<main class="container" id="app">
  <div class="public-state" id="loading"><div><span class="ui-spinner" style="display:inline-block"></span><p>Carregando...</p></div></div>
</main>
<template id="pageTpl">
  <img src="/img/logo.png" class="logo" id="pLogo" alt="">
  <h1 id="pName"></h1>
  <span class="status aberto" id="pStatus"><i></i><span></span></span>
  <div class="info-cards info-horario">
    <div class="info-card"><span class="mini-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><div><small>Hoje</small><b id="pHours">—</b></div></div>
    <div class="info-card" id="pAddressCard"><span class="mini-icon"><svg viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></span><div><small>Localização</small><b id="pAddress">—</b></div></div>
    <div class="info-card"><span class="mini-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><div><small>Serviços</small><b id="pServicesCount">—</b></div></div>
  </div>
  <a href="#" class="main-schedule-btn" id="mainBook">Agendar agora</a>
  <div class="social" id="pSocial">
    <a href="#" data-k="instagram" aria-label="Instagram" title="Instagram" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5.2"/><circle cx="12" cy="12" r="4.1"/><circle class="social-dot" cx="17.4" cy="6.7" r="1.05"/></svg></a>
    <a href="#" data-k="whatsapp" aria-label="WhatsApp" title="WhatsApp" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 11.8a8.2 8.2 0 0 1-12.1 7.2L4 20l1.1-4a8.2 8.2 0 1 1 15.1-4.2Z"/><path d="M8.6 8.2c.4 3.2 3 5.8 6.2 6.2"/><path d="m8.8 8.4 1.3 2-1 1.1M14.5 13.1l-1.2 1 2.1 1.2"/></svg></a>
    <a href="#" data-k="facebook" aria-label="Facebook" title="Facebook" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="social-fill" d="M13.7 21v-8h2.8l.4-3h-3.2V8.1c0-.9.3-1.5 1.6-1.5H17V4a23 23 0 0 0-2.4-.1c-2.4 0-4.1 1.5-4.1 4.2V10H8v3h2.5v8h3.2Z"/></svg></a>
    <a href="#" data-k="tiktok" aria-label="TikTok" title="TikTok" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.2 4.2v10.1a4.1 4.1 0 1 1-3.4-4"/><path d="M14.2 4.2c.6 2.2 2.2 3.6 4.7 3.9"/></svg></a>
  </div>
  <section class="services" id="pServices"><h2>Serviços</h2></section>
  <section class="reviews" id="pReviews"><h2>Avaliações</h2>
    <div class="google-review"><div class="stars" id="pStars" aria-label="Nota"></div><h3 id="pRating"></h3><p>Confira as avaliações dos nossos clientes e veja a qualidade do nosso trabalho.</p><a href="#" class="review-btn" id="pReviewBtn" target="_blank" rel="noopener">Avaliar no Google</a></div>
  </section>
  <section class="location" id="pLocation"><h2>Localização</h2><div class="map" id="pMap"></div><a href="#" class="route-btn" id="pRoute" target="_blank" rel="noopener">Ver rota no Google Maps</a></section>
  <footer class="visionario-credit"><a href="https://visionariodev.com.br" target="_blank" rel="noopener">Desenvolvido por Visionário Dev</a></footer>
</template>
<script type="module" src="agendamento.js"></script>
</body>
</html>
