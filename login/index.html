<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | BarberSaaS</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/img/favicon.png"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#08a9df"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#fff;font-family:Poppins,Arial}.card{width:min(92%,420px);background:#101c2e;border:1px solid #20334d;padding:32px;border-radius:22px}h1{margin:0 0 6px}h1 span{color:#08a9df}p{color:#91a2b8}label{display:block;margin:16px 0 6px}input{width:100%;padding:14px;border-radius:10px;border:1px solid #30445f;background:#091525;color:#fff;font-size:16px}button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:10px;background:#08a9df;font-weight:700;cursor:pointer}.link{background:transparent;color:#9bdfff;margin-top:8px}.msg{min-height:24px;margin-top:12px;color:#f7c66a}</style></head><body><main class="card"><h1>Barber<span>SaaS</span></h1><p id="subtitle">Entre para administrar sua barbearia.</p><form id="form"><label>E-mail</label><input id="email" type="email" autocomplete="email" required><label>Senha</label><input id="password" type="password" autocomplete="current-password" minlength="6" required><button id="submit">Entrar</button></form><button class="link" id="first">Primeiro acesso DEV</button><button class="link" id="forgot">Esqueci minha senha</button><div class="msg" id="msg"></div></main><script type="module" src="login.js"></script><script type="module" src="/shared/pwa.js"></script></body></html>
