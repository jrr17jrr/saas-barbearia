<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Entrar | BarberSaaS</title>
<!-- pwa-head -->
<link rel="stylesheet" href="/ui.css">
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#fff;font-family:Poppins,Arial,sans-serif;padding:16px}.card{width:min(100%,420px);background:#101c2e;border:1px solid #20334d;padding:32px;border-radius:22px}h1{margin:0 0 6px}h1 span{color:#08a9df}p{color:#91a2b8;margin:0 0 6px}label{display:block;margin:16px 0 6px;font-size:14px}input{width:100%;padding:14px;border-radius:10px;border:1px solid #30445f;background:#091525;color:#fff;font-size:16px;min-height:48px}input:focus{outline:2px solid #08a9df;outline-offset:1px}button{width:100%;min-height:48px;padding:14px;margin-top:18px;border:0;border-radius:10px;background:#08a9df;color:#04101a;font-weight:700;font-size:15px;cursor:pointer}button:disabled{opacity:.6}.link{background:transparent;color:#9bdfff;margin-top:8px;font-weight:500}.msg{min-height:24px;margin-top:12px;color:#f7c66a;font-size:14px}.msg.ok{color:#86efac}.pw{position:relative}.pw button{position:absolute;right:6px;top:4px;width:auto;margin:0;min-height:40px;padding:8px 10px;background:transparent;color:#9bdfff;font-size:12px}.credit{margin-top:22px;text-align:center;font-size:11px}.credit a{color:#718096;text-decoration:none}</style>
</head>
<body>
<main class="card">
  <h1>Barber<span>SaaS</span></h1>
  <p id="subtitle">Entre para administrar sua barbearia.</p>
  <form id="form" novalidate>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" inputmode="email" required>
    <div id="passwordWrap">
      <label for="password">Senha</label>
      <div class="pw"><input id="password" type="password" autocomplete="current-password" minlength="6" required><button type="button" id="togglePw" aria-label="Mostrar senha">Mostrar</button></div>
    </div>
    <button id="submit" type="submit">Entrar</button>
  </form>
  <button class="link" id="forgot" type="button">Esqueci minha senha</button>
  <div class="msg" id="msg" role="alert" aria-live="polite"></div>
  <div class="credit"><a href="https://visionariodev.com.br" target="_blank" rel="noopener">Desenvolvido por Visionário Dev</a></div>
</main>
<script type="module" src="login.js"></script>
</body>
</html>
