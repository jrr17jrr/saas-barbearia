<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meu site | BarberSaaS</title>
<!-- pwa-head -->
<link rel="stylesheet" href="/menu.css">
<link rel="stylesheet" href="editarlink.css">
<link rel="stylesheet" href="/ui.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>.linkbox{display:flex;gap:8px;align-items:center;background:#0d1728;border:1px solid #243249;padding:10px;border-radius:10px;flex-wrap:wrap}.linkbox code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:12px;color:#7dd3fc}.linkbox button,.linkbox a{min-height:40px}.site-service{grid-template-columns:56px 1fr auto}.site-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0d1728;border:1px solid #243249;border-radius:11px;padding:12px;margin-bottom:12px}.savebar .save{min-height:44px}</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar"><div class="logo"><h2>Barber<span>SaaS</span></h2></div><nav class="menu"></nav></aside>
  <button class="menu-mobile" id="menuBtn" type="button">☰</button>
  <div class="overlay" id="overlay"></div>
  <main class="content"><div class="container">
    <header class="top"><div><span class="eyebrow">Página pública</span><h1>Meu site</h1><p>Personalize as informações que seus clientes verão.</p></div><a href="#" id="viewSite" class="preview" target="_blank" rel="noopener">Ver site público ↗</a></header>
    <div id="formArea"><div class="ui-state loading"><span class="ui-spinner"></span>Carregando...</div></div>
  </div><div class="panel-visionario-credit"><a href="https://visionariodev.com.br" target="_blank" rel="noopener">Desenvolvido por Visionário Dev</a></div></main>
</div>
<template id="formTpl">
  <section class="card"><div class="section-title"><div><h2>Link de agendamento</h2><p>Envie no WhatsApp, Instagram ou coloque na bio.</p></div></div>
    <div class="site-toggle"><div><b>Site público ativo</b><br><small class="ui-muted">Desative para pausar o agendamento pelo site.</small></div><label class="switch"><input type="checkbox" id="siteEnabled" aria-label="Site público ativo"><span></span></label></div>
    <div class="linkbox"><code id="publicLink">—</code><button type="button" class="secondary" id="copyLink">Copiar link</button><a class="secondary" id="shareWa" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center">Enviar no WhatsApp</a></div>
  </section>
  <section class="card"><div class="section-title"><div><h2>Perfil da barbearia</h2><p>Identidade e informações principais.</p></div></div>
    <div class="logo-area"><img id="logoPreview" src="/img/logo.png" alt="Logo da barbearia"><label class="upload-btn">Alterar logo<input id="logoInput" type="file" accept="image/png,image/jpeg,image/webp"></label><button type="button" class="secondary" id="removeLogo">Remover</button></div>
    <div class="form-grid"><label>Nome<input id="shopName" maxlength="80"></label><label>Status exibido<select id="shopStatus"><option>Aberto agora</option><option>Fechado</option><option>Somente com horário marcado</option><option>Em férias</option></select></label></div>
    <label>Descrição<textarea id="shopDescription" maxlength="300"></textarea></label>
  </section>
  <section class="card"><div class="section-title"><div><h2>Aparência</h2><p>Escolha uma identidade pronta. Todas as combinações mantêm o site bonito e legível.</p></div></div>
    <div class="theme-grid">
      <button type="button" class="theme-option" data-theme="cyan"><span class="theme-preview"><i style="background:#0b1220"></i><i style="background:#131e31"></i><i style="background:#08a9df"></i></span><b>Ciano</b><small>Moderno</small></button>
      <button type="button" class="theme-option" data-theme="gold"><span class="theme-preview"><i style="background:#0c0c0d"></i><i style="background:#191919"></i><i style="background:#d6a83b"></i></span><b>Dourado</b><small>Premium</small></button>
      <button type="button" class="theme-option" data-theme="light"><span class="theme-preview"><i style="background:#f5f7fa"></i><i style="background:#ffffff"></i><i style="background:#2563eb"></i></span><b>Claro</b><small>Clean</small></button>
      <button type="button" class="theme-option" data-theme="red"><span class="theme-preview"><i style="background:#0b0b0d"></i><i style="background:#19191d"></i><i style="background:#e63946"></i></span><b>Vermelho</b><small>Classic Barber</small></button>
    </div>
    <div class="color-grid show"><label>Cor principal<input type="color" id="cPrimary"></label><label>Fundo<input type="color" id="cBackground"></label><label>Cards<input type="color" id="cCard"></label></div>
    <div class="live-preview-wrap"><div class="live-preview-head"><div><b>Prévia ao vivo</b><small>Veja como o cliente vai enxergar sua página.</small></div><span>Atualiza automaticamente</span></div>
      <div class="phone-preview" id="livePreview"><div class="preview-page"><img id="previewLogo" class="preview-logo" src="/img/logo.png" alt=""><b id="previewName">Barbearia</b><span id="previewStatus">● Aberto agora</span><div class="preview-info"><i></i><i></i><i></i></div><button type="button" class="preview-cta" tabindex="-1">Agendar agora</button><div class="preview-social" id="previewSocial"><i data-social="instagram">◎</i><i data-social="whatsapp">◌</i><i data-social="facebook">f</i><i data-social="tiktok">♪</i></div><div class="preview-card"><strong>Serviços</strong><div id="previewServices"></div></div></div></div></div>
  </section>
  <section class="card"><div class="section-title"><div><h2>Informações e redes</h2><p>Ative apenas as redes que a barbearia realmente usa.</p></div></div>
    <div class="form-grid"><label>Endereço<input id="address" maxlength="160"></label><label>WhatsApp<input id="whatsapp" inputmode="tel"></label></div>
    <div class="social-settings">
      <div class="social-setting"><div><b>Instagram</b><small>Mostrar no site público</small></div><label class="switch"><input type="checkbox" id="instagramEnabled" aria-label="Mostrar Instagram"><span></span></label><input id="instagram" placeholder="@barbearia ou link" maxlength="120"></div>
      <div class="social-setting"><div><b>WhatsApp</b><small>Mostrar atalho no site</small></div><label class="switch"><input type="checkbox" id="whatsappEnabled" aria-label="Mostrar WhatsApp"><span></span></label><span class="social-note">Usa o número informado acima</span></div>
      <div class="social-setting"><div><b>Facebook</b><small>Mostrar no site público</small></div><label class="switch"><input type="checkbox" id="facebookEnabled" aria-label="Mostrar Facebook"><span></span></label><input id="facebook" placeholder="Link do Facebook" maxlength="160"></div>
      <div class="social-setting"><div><b>TikTok</b><small>Mostrar no site público</small></div><label class="switch"><input type="checkbox" id="tiktokEnabled" aria-label="Mostrar TikTok"><span></span></label><input id="tiktok" placeholder="@barbearia ou link" maxlength="120"></div>
    </div>
  </section>
  <section class="card"><div class="section-title"><div><h2>Serviços exibidos</h2><p>Os serviços ativos aparecem automaticamente no site. Preço e duração vêm do cadastro.</p></div><a class="secondary" href="/servicos/" style="text-decoration:none">Gerenciar serviços</a></div><div id="serviceList"></div></section>
  <section class="card"><div class="section-title"><div><h2>Avaliações e localização</h2><p>Links usados na página pública.</p></div></div>
    <div class="form-grid"><label>Nota Google<input id="rating" type="number" min="0" max="5" step="0.1" inputmode="decimal"></label><label>Link para avaliar no Google<input id="reviewLink" placeholder="https://" maxlength="300"></label></div>
    <label>Link da localização no Google Maps<input id="mapsLink" placeholder="https://maps.app.goo.gl/..." maxlength="300"></label>
  </section>
  <div class="savebar"><span id="saveState">As alterações aparecem no site público assim que forem salvas.</span><button type="button" class="save" id="saveBtn">Salvar alterações</button></div>
</template>
<script src="/menu.js"></script>
<script type="module" src="editarlink.js"></script>
</body>
</html>
